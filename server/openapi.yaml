          example: Quartalsweise
      example:
        currentScore: 8
        status: Überwacht
    RiskPage:
      title: RiskPage
      description: Paginierte Ergebnisliste für Risiken.
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Risk"
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 500
          example: 25
        total:
          type: integer
          minimum: 0
          example: 42
        totalPages:
          type: integer
          minimum: 1
          example: 2
      required:
        - items
        - page
        - pageSize
        - total
        - totalPages
    ErrorResponse:
      title: ErrorResponse
      description: Einheitliche Fehlerantwort der Risk-Register-API.
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - RISK_NOT_FOUND
            - MEASURE_NOT_FOUND
            - USER_NOT_FOUND
            - AUTH_FAILED
            - FORBIDDEN
            - INTERNAL_ERROR
          example: RISK_NOT_FOUND
        message:
          type: string
          example: Das Risiko mit der angegebenen ID wurde nicht gefunden.
      required:
        - code
        - message
    HealthResponse:
      title: HealthResponse
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
      required:
        - status
    Measure:
      title: Measure
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Technische ID der Maßnahme.
          example: 01J00000000000000000002000
        riskId:
          anyOf:
            - type: string
              minLength: 1
            - type: "null"
          description: Optional verknüpftes Risiko.
          example: 01J00000000000000000000001
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Kurzer Titel der Maßnahme.
          example: Alternativen Lieferanten qualifizieren
        description:
          type: string
          minLength: 1
          maxLength: 2000
          description: Beschreibung der Maßnahme oder des nächsten Schritts.
          example: Beschaffung prüft und bewertet zwei alternative Lieferanten für
            kritische Komponenten.
        owner:
          type: string
          minLength: 1
          maxLength: 200
          description: Verantwortliche Person.
          example: Lena Vogt
        dueDate:
          anyOf:
            - type: string
              format: date
            - type: "null"
          description: Fälligkeitsdatum im Format YYYY-MM-DD oder null.
          example: 2026-08-15
        priority:
          type: string
          enum:
            - Kritisch
            - Hoch
            - Normal
          description: Priorität der Maßnahme.
          example: Hoch
        status:
          type: string
          enum:
            - Offen
            - In Arbeit
            - Erledigt
          description: Bearbeitungsstatus der Maßnahme.
          example: Offen
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: 2026-07-12T08:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: 2026-07-12T08:00:00.000Z
      required:
        - id
        - riskId
        - title
        - description
        - owner
        - dueDate
        - priority
        - status
        - createdAt
        - updatedAt
      example:
        id: 01J00000000000000000002000
        riskId: 01J00000000000000000000001
        title: Alternativen Lieferanten qualifizieren
        description: Beschaffung prüft und bewertet zwei alternative Lieferanten für
          kritische Komponenten.
        owner: Lena Vogt
        dueDate: 2026-08-15
        priority: Hoch
        status: Offen
        createdAt: 2026-07-12T08:00:00.000Z
        updatedAt: 2026-07-12T08:00:00.000Z
    CreateMeasure:
      title: CreateMeasure
      type: object
      additionalProperties: false
      properties:
        riskId:
          anyOf:
            - type: string
              minLength: 1
            - type: "null"
