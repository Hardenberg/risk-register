          example: 22
        currentScore:
          type: integer
          minimum: 1
          maximum: 25
          description: Aktuell bewerteter Risikowert.
          example: 18
        status:
          type: string
          enum:
            - Offen
            - In Bearbeitung
            - Überwacht
            - Geschlossen
          description: Aktueller Bearbeitungsstatus des Risikos.
          example: In Bearbeitung
        dueDate:
          anyOf:
            - type: string
              format: date
            - type: "null"
          description: Geplantes Fälligkeitsdatum im Format YYYY-MM-DD oder null.
          example: 2026-07-18
        reviewDate:
          anyOf:
            - type: string
              format: date
            - type: "null"
          description: Datum der nächsten fachlichen Überprüfung im Format YYYY-MM-DD. Bei
            Fix ist ein Datum erforderlich; bei wiederkehrenden Rhythmen wird es
            serverseitig berechnet.
          example: 2026-07-18
        reviewCycle:
          type: string
          enum:
            - Fix
            - Monatlich
            - Quartalsweise
            - Halbjährlich
            - Jährlich
            - 2-jährlich
          description: Konfigurierbarer Rhythmus für die fachliche Überprüfung. Bei Fix
            ist reviewDate manuell, bei anderen Rhythmen wird reviewDate
            berechnet.
          example: Quartalsweise
      required:
        - title
        - description
        - category
        - owner
        - initialScore
      example:
        title: Lieferengpass bei Kernkomponenten
        description: Risiko von Lieferverzögerungen bei kritischen Kernkomponenten mit
          möglicher Auswirkung auf Produktion und Kundenliefertermine.
        category: Lieferkette
        owner: Lena Vogt
        initialScore: 22
        currentScore: 18
        status: In Bearbeitung
        dueDate: 2026-07-18
        reviewDate: 2026-07-18
        reviewCycle: Quartalsweise
    UpdateRisk:
      title: UpdateRisk
      description: Mindestens ein zu änderndes Feld eines vorhandenen Risikos.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Kurze, eindeutige Bezeichnung des Risikos.
          example: Lieferengpass bei Kernkomponenten
        description:
          type: string
          minLength: 1
          maxLength: 2000
          description: Fachliche Beschreibung des Risikos, seiner Ursache oder möglichen
