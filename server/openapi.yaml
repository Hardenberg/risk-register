            möglicher Auswirkung auf Produktion und Kundenliefertermine.
        category:
          type: string
          minLength: 1
          maxLength: 200
          description: Fachliche Risikokategorie.
          example: Lieferkette
        owner:
          type: string
          minLength: 1
          maxLength: 200
          description: Für die Behandlung des Risikos verantwortliche Person.
