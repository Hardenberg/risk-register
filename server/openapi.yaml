          example: Admin
        active:
          type: boolean
          description: Steuert, ob sich der Benutzer anmelden darf.
          example: true
        password:
          type: string
          minLength: 8
          maxLength: 200
          description: Passwort des Benutzers. Wird nie in API-Antworten zurückgegeben.
          example: admin123
      example:
        active: false
    UpdateProfile:
      title: UpdateProfile
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 80
          pattern: ^[a-zA-Z0-9._-]+$
          description: Eindeutiger Benutzername für die Anmeldung.
          example: admin
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Anzeigename des Benutzers.
          example: Admin User
        email:
          type: string
          format: email
          maxLength: 254
          description: E-Mail-Adresse des Benutzers.
          example: admin@example.local
        department:
          type: string
          minLength: 1
          maxLength: 200
          description: Abteilung des Benutzers.
          example: Risk Management
        password:
          type: string
          minLength: 8
          maxLength: 200
          description: Passwort des Benutzers. Wird nie in API-Antworten zurückgegeben.
          example: admin123
      example:
        name: Lena Vogt
        department: Risk Office
    LoginRequest:
      title: LoginRequest
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          description: Benutzername oder E-Mail-Adresse.
          example: admin
        password:
          type: string
          minLength: 8
          maxLength: 200
          description: Passwort des Benutzers. Wird nie in API-Antworten zurückgegeben.
          example: admin123
      required:
        - username
        - password
    LoginResponse:
      title: LoginResponse
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          minLength: 1
          description: Bearer-Token für nachfolgende API-Anfragen.
          example: eyJzdWIiOiIxIn0.signature
      required:
        - user
        - token
    ApplicationSettings:
      title: ApplicationSettings
      type: object
      additionalProperties: false
      properties:
        organizationName:
          type: string
          minLength: 1
          maxLength: 120
          description: Name der Organisation oder des Bereichs.
          example: Risk Register
        defaultReviewCycle:
          type: string
          enum:
            - Fix
            - Monatlich
            - Quartalsweise
            - Halbjährlich
            - Jährlich
            - 2-jährlich
          description: Standard-Review-Rhythmus für neue Risiken.
          example: Fix
        reviewReminderDays:
          type: integer
          minimum: 0
          maximum: 365
          description: Anzahl Tage vor dem Review-Datum für Erinnerungen.
          example: 14
        highRiskThreshold:
          type: integer
          minimum: 1
          maximum: 25
          description: Risikowert ab dem Risiken als hoch gelten.
          example: 10
        criticalRiskThreshold:
          type: integer
          minimum: 1
          maximum: 25
          description: Risikowert ab dem Risiken als kritisch gelten.
          example: 16
      required:
        - organizationName
        - defaultReviewCycle
        - reviewReminderDays
        - highRiskThreshold
        - criticalRiskThreshold
      example:
        organizationName: Risk Register
        defaultReviewCycle: Fix
        reviewReminderDays: 14
        highRiskThreshold: 10
        criticalRiskThreshold: 16
    UpdateApplicationSettings:
      title: UpdateApplicationSettings
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        organizationName:
          type: string
          minLength: 1
          maxLength: 120
          description: Name der Organisation oder des Bereichs.
          example: Risk Register
        defaultReviewCycle:
          type: string
          enum:
            - Fix
            - Monatlich
            - Quartalsweise
            - Halbjährlich
            - Jährlich
            - 2-jährlich
          description: Standard-Review-Rhythmus für neue Risiken.
          example: Fix
        reviewReminderDays:
          type: integer
          minimum: 0
          maximum: 365
          description: Anzahl Tage vor dem Review-Datum für Erinnerungen.
          example: 14
        highRiskThreshold:
          type: integer
          minimum: 1
          maximum: 25
          description: Risikowert ab dem Risiken als hoch gelten.
          example: 10
        criticalRiskThreshold:
          type: integer
          minimum: 1
          maximum: 25
          description: Risikowert ab dem Risiken als kritisch gelten.
          example: 16
      example:
        organizationName: Risk Register
        defaultReviewCycle: Fix
        reviewReminderDays: 14
        highRiskThreshold: 10
        criticalRiskThreshold: 16
paths:
  /health:
    get:
      operationId: getHealth
      summary: Serverstatus abrufen
      tags:
        - System
      description: Ein einfacher Liveness-Check für den Fastify-Prozess und seine
        SQLite-Anbindung.
      responses:
        "200":
          description: Der Server ist betriebsbereit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/risks:
    get:
      operationId: listRisks
      summary: Risiken abrufen
      tags:
        - Risiken
      description: Liefert Risiken serverseitig gefiltert, sortiert und paginiert.
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
          in: query
          name: page
          required: false
          description: Eins-basierte Seitennummer.
        - schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
          in: query
          name: pageSize
          required: false
          description: Anzahl der Datensätze pro Seite.
        - schema:
            type: string
            maxLength: 200
          example: Lieferkette
          in: query
          name: search
          required: false
          description: Freitextsuche in Referenz, Bezeichnung, Beschreibung, Kategorie und
            Verantwortlichem.
        - schema:
            type: string
            enum:
              - Offen
              - In Bearbeitung
              - Überwacht
              - Geschlossen
          in: query
          name: status
          required: false
          description: Filtert nach Bearbeitungsstatus.
        - schema:
            type: string
            maxLength: 200
          in: query
          name: category
          required: false
          description: Filtert nach exakt passender Kategorie.
        - schema:
            type: string
            maxLength: 200
          in: query
          name: owner
          required: false
          description: Filtert nach exakt passender verantwortlicher Person.
        - schema:
            type: string
            enum:
              - reference
              - title
              - category
              - owner
              - currentScore
              - status
              - dueDate
              - reviewDate
              - createdAt
              - updatedAt
            default: currentScore
          in: query
          name: sortBy
          required: false
          description: Sortierfeld.
        - schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          in: query
          name: sortDirection
          required: false
          description: Sortierrichtung.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Die gefundene Risikoseite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskPage"
        "401":
          description: Die Anfrage benötigt eine gültige Anmeldung.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unerwarteter interner Serverfehler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createRisk
      summary: Ein Risiko erfassen
      tags:
        - Risiken
      description: Erfasst ein neues Risiko. ID, Referenz und Zeitstempel werden
        serverseitig erzeugt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRisk"
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Das erfolgreich erfasste Risiko.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Risk"
        "400":
          description: Die Anfrage enthält ungültige oder unvollständige Daten.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Die Anfrage benötigt eine gültige Anmeldung.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unerwarteter interner Serverfehler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/risks/{id}:
    get:
      operationId: getRisk
      summary: Ein Risiko abrufen
      tags:
        - Risiken
      description: Liefert ein einzelnes Risiko anhand seiner technischen ID.
      parameters:
        - schema:
            type: string
            minLength: 1
