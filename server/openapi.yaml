        - pageSize
        - total
        - totalPages
    User:
      title: User
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Technische ID des Benutzers.
          example: 01J00000000000000000001000
        username:
          type: string
          minLength: 3
          maxLength: 80
          pattern: ^[a-zA-Z0-9._-]+$
          description: Eindeutiger Benutzername für die Anmeldung.
          example: admin
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Anzeigename des Benutzers.
          example: Admin User
        email:
          type: string
          format: email
          maxLength: 254
          description: E-Mail-Adresse des Benutzers.
          example: admin@example.local
        department:
          type: string
          minLength: 1
          maxLength: 200
          description: Abteilung des Benutzers.
          example: Risk Management
        role:
          type: string
          enum:
            - Admin
            - User
          description: Rolle des Benutzers. Nur Admins dürfen Einstellungen und Benutzer
            verwalten.
          example: Admin
        active:
          type: boolean
          description: Steuert, ob sich der Benutzer anmelden darf.
          example: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: 2026-07-01T08:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: 2026-07-01T08:00:00.000Z
      required:
        - id
        - username
        - name
        - email
        - department
        - role
        - active
        - createdAt
        - updatedAt
      example:
        id: 01J00000000000000000001000
        username: admin
        name: Admin User
        email: admin@example.local
        department: Risk Management
        role: Admin
        active: true
        createdAt: 2026-07-01T08:00:00.000Z
        updatedAt: 2026-07-01T08:00:00.000Z
    CreateUser:
      title: CreateUser
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 80
          pattern: ^[a-zA-Z0-9._-]+$
          description: Eindeutiger Benutzername für die Anmeldung.
          example: admin
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Anzeigename des Benutzers.
          example: Admin User
        email:
          type: string
          format: email
          maxLength: 254
          description: E-Mail-Adresse des Benutzers.
          example: admin@example.local
        department:
          type: string
          minLength: 1
          maxLength: 200
          description: Abteilung des Benutzers.
          example: Risk Management
        role:
          type: string
          enum:
            - Admin
            - User
          description: Rolle des Benutzers. Nur Admins dürfen Einstellungen und Benutzer
            verwalten.
          example: Admin
        active:
          type: boolean
          description: Steuert, ob sich der Benutzer anmelden darf.
          example: true
        password:
          type: string
          minLength: 8
          maxLength: 200
          description: Passwort des Benutzers. Wird nie in API-Antworten zurückgegeben.
          example: admin123
      required:
        - username
        - name
        - email
        - department
        - password
      example:
        username: lena.vogt
        name: Lena Vogt
        email: lena.vogt@example.local
        department: Risk Management
        role: User
        password: sicher123
        active: true
    UpdateUser:
      title: UpdateUser
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        username:
