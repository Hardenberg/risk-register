openapi: 3.0.3
info:
  title: Risk Register API
  version: 1.0.0
  description: >-
    REST-API zur Verwaltung eines Risikoregisters.


    Die API unterstützt das Erfassen, Suchen, Aktualisieren und Löschen von
    Risiken.

    Risikowerte liegen zwischen 1 und 25 und ergeben sich fachlich aus
    Eintrittswahrscheinlichkeit × Auswirkung.
  contact:
    name: Risk Register Team
  license:
    name: Private use
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: signed-token
  schemas:
    Risk:
      title: Risk
      description: Ein vollständig gespeichertes Risiko.
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Technische, unveränderliche ID des Risikos.
          example: 01J00000000000000000000001
        reference:
          type: string
          pattern: ^R-\d{3,}$
          description: Menschenlesbare, automatisch vergebene Risikoreferenz.
          example: R-024
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Kurze, eindeutige Bezeichnung des Risikos.
          example: Lieferengpass bei Kernkomponenten
        description:
          type: string
          minLength: 1
          maxLength: 2000
          description: Fachliche Beschreibung des Risikos, seiner Ursache oder möglichen
            Auswirkung.
          example: Risiko von Lieferverzögerungen bei kritischen Kernkomponenten mit
            möglicher Auswirkung auf Produktion und Kundenliefertermine.
        category:
          type: string
          minLength: 1
          maxLength: 200
          description: Fachliche Risikokategorie.
          example: Lieferkette
        owner:
          type: string
          minLength: 1
          maxLength: 200
          description: Für die Behandlung des Risikos verantwortliche Person.
          example: Lena Vogt
        initialScore:
          type: integer
          minimum: 1
          maximum: 25
          description: Risikowert bei der erstmaligen Erfassung
            (Eintrittswahrscheinlichkeit × Auswirkung).
          example: 22
        currentScore:
          type: integer
          minimum: 1
          maximum: 25
          description: Aktuell bewerteter Risikowert.
          example: 18
        status:
          type: string
          enum:
            - Offen
            - In Bearbeitung
            - Überwacht
            - Geschlossen
          description: Aktueller Bearbeitungsstatus des Risikos.
          example: In Bearbeitung
        dueDate:
          anyOf:
            - type: string
              format: date
            - type: "null"
          description: Geplantes Fälligkeitsdatum im Format YYYY-MM-DD oder null.
          example: 2026-07-18
        reviewDate:
          anyOf:
            - type: string
              format: date
            - type: "null"
          description: Datum der nächsten fachlichen Überprüfung im Format YYYY-MM-DD. Bei
            Fix ist ein Datum erforderlich; bei wiederkehrenden Rhythmen wird es
            serverseitig berechnet.
          example: 2026-07-18
        reviewCycle:
          type: string
          enum:
            - Fix
            - Monatlich
            - Quartalsweise
            - Halbjährlich
            - Jährlich
            - 2-jährlich
          description: Konfigurierbarer Rhythmus für die fachliche Überprüfung. Bei Fix
            ist reviewDate manuell, bei anderen Rhythmen wird reviewDate
            berechnet.
          example: Quartalsweise
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Zeitpunkt der Erfassung im ISO-8601-Format.
          example: 2026-07-01T08:00:00.000Z
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Zeitpunkt der letzten Änderung im ISO-8601-Format.
          example: 2026-07-07T10:30:00.000Z
        deletedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          readOnly: true
          description: Zeitpunkt der Löschmarkierung oder null bei aktiven Risiken.
          example: null
      required:
        - id
        - reference
        - title
        - description
        - category
        - owner
        - initialScore
        - currentScore
        - status
        - dueDate
        - reviewDate
        - reviewCycle
        - createdAt
        - updatedAt
        - deletedAt
      example:
        id: 01J00000000000000000000001
        reference: R-024
        title: Lieferengpass bei Kernkomponenten
        description: Risiko von Lieferverzögerungen bei kritischen Kernkomponenten mit
          möglicher Auswirkung auf Produktion und Kundenliefertermine.
        category: Lieferkette
        owner: Lena Vogt
        initialScore: 22
        currentScore: 18
        status: In Bearbeitung
        dueDate: 2026-07-18
        reviewDate: 2026-07-18
        reviewCycle: Quartalsweise
        createdAt: 2026-07-01T08:00:00.000Z
        updatedAt: 2026-07-07T10:30:00.000Z
        deletedAt: null
    CreateRisk:
      title: CreateRisk
      description: Daten zur Erfassung eines neuen Risikos. Nicht gesetzte optionale
        Werte werden aus dem Initialwert abgeleitet.
      type: object
      additionalProperties: false
