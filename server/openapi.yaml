              format: date
            - type: "null"
          description: Fälligkeitsdatum im Format YYYY-MM-DD oder null.
          example: 2026-08-15
        priority:
          type: string
          enum:
            - Kritisch
            - Hoch
            - Normal
          description: Priorität der Maßnahme.
          example: Hoch
        status:
          type: string
          enum:
            - Offen
            - In Arbeit
            - Erledigt
          description: Bearbeitungsstatus der Maßnahme.
          example: Offen
      required:
        - title
        - description
        - owner
      example:
        id: 01J00000000000000000002000
        riskId: 01J00000000000000000000001
        title: Alternativen Lieferanten qualifizieren
        description: Beschaffung prüft und bewertet zwei alternative Lieferanten für
          kritische Komponenten.
        owner: Lena Vogt
        dueDate: 2026-08-15
        priority: Hoch
        status: Offen
        createdAt: 2026-07-12T08:00:00.000Z
        updatedAt: 2026-07-12T08:00:00.000Z
    UpdateMeasure:
      title: UpdateMeasure
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        riskId:
          anyOf:
            - type: string
              minLength: 1
            - type: "null"
          description: Optional verknüpftes Risiko.
          example: 01J00000000000000000000001
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Kurzer Titel der Maßnahme.
          example: Alternativen Lieferanten qualifizieren
        description:
          type: string
          minLength: 1
          maxLength: 2000
          description: Beschreibung der Maßnahme oder des nächsten Schritts.
          example: Beschaffung prüft und bewertet zwei alternative Lieferanten für
            kritische Komponenten.
        owner:
          type: string
          minLength: 1
          maxLength: 200
          description: Verantwortliche Person.
          example: Lena Vogt
        dueDate:
          anyOf:
            - type: string
              format: date
            - type: "null"
          description: Fälligkeitsdatum im Format YYYY-MM-DD oder null.
          example: 2026-08-15
        priority:
          type: string
          enum:
            - Kritisch
            - Hoch
            - Normal
          description: Priorität der Maßnahme.
          example: Hoch
        status:
          type: string
          enum:
            - Offen
            - In Arbeit
            - Erledigt
          description: Bearbeitungsstatus der Maßnahme.
          example: Offen
      example:
        status: In Arbeit
    MeasurePage:
      title: MeasurePage
      description: Paginierte Ergebnisliste für Maßnahmen.
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Measure"
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
